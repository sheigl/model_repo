<div class="border-line pt-3" data-job="{{ j.id }}">
  <div class="flex items-center justify-between gap-3">
    <div class="min-w-0">
      <p class="font-medium text-ink truncate">{{ j.description }}</p>
      <p class="text-xs text-slate-500">{{ j.id[:14] }} · {{ j.kind }} · {{ j.created_at }}</p>
    </div>
    <div class="flex items-center gap-3 shrink-0">
      <span class="badge {% if j.status.value == 'done' %}bg-ok/10 text-ok{% elif j.status.value == 'failed' %}bg-err/10 text-err{% elif j.status.value == 'running' %}bg-info/10 text-info{% else %}bg-slate-100 text-slate-600{% endif %}">{{ j.status.value }}</span>
      <button class="btn-ghost" onclick="toggleLog('{{ j.id }}', this)">Show log</button>
    </div>
  </div>
  <div class="mt-2 h-2 w-full overflow-hidden rounded bg-slate-200">
    <div class="h-full bg-brand transition-all" style="width:{{ j.progress }}%"></div>
  </div>
  <div class="log-wrap hidden"><pre class="log" data-stream="{{ j.id }}"></pre></div>
</div>
