{% extends "base.html" %}
{% block title %}Jobs — Model Deployment{% endblock %}
{% block content %}
<div class="mb-5">
  <h1 class="text-2xl font-semibold tracking-tight text-ink">Job queue</h1>
  <p class="mt-1 text-sm text-slate-500">Deploys, downloads and syncs run on a single background worker. Live output streams here.</p>
</div>

<div class="card space-y-3" id="job-list">
  <p class="text-slate-500">No jobs yet.</p>
</div>
{% endblock %}

{% block scripts %}
<script>
const STATUS_CLASS = {
  queued: 'bg-slate-100 text-slate-600',
  running: 'bg-info/10 text-info',
  done: 'bg-ok/10 text-ok',
  failed: 'bg-err/10 text-err',
  cancelled: 'bg-amber-100 text-amber-700',
};
function statusBadge(status){ return `<span class="badge ${STATUS_CLASS[status]||'bg-slate-600'}">${status}</span>`; }


async function refresh(){
  const list = document.getElementById('job-list');
  try {
    const r = await fetch('/api/jobs');
    const data = await r.json();
    if(!data.jobs.length){ list.innerHTML = '<p class="text-slate-400">No jobs yet.</p>'; return; }
    list.innerHTML = data.jobs.map(jobRow).join('');
    document.querySelectorAll('[data-stream]').forEach(el => startStream(el.dataset.stream, el));
  } catch(e){
    // A failed/stale fetch used to silently leave the "No jobs yet." placeholder,
    // making a running job look like it never existed. Surface it + allow retry.
    list.innerHTML = '<p class="text-err cursor-pointer" onclick="refresh()">Couldn’t load jobs — <span class="underline">tap to retry</span></p>';
  }
}

async function cancelJob(jobId, btn){
  btn.disabled = true;
  try {
    const r = await fetch(`/api/job/${jobId}/cancel`, {method: 'POST'});
    if(!r.ok) throw new Error((await r.json()).error || 'cancel failed');
    refresh();
  } catch(e){
    btn.disabled = false;
    alert(e.message);
  }
}

async function restartJob(jobId, btn){
  btn.disabled = true;
  try {
    const r = await fetch(`/api/job/${jobId}/restart`, {method: 'POST'});
    if(!r.ok) throw new Error((await r.json()).error || 'restart failed');
    refresh();
  } catch(e){
    btn.disabled = false;
    alert(e.message);
  }
}

function jobRow(j){
  const shortId = j.id.slice(0,14);
  let actions = '';
  if(j.status === 'queued' || j.status === 'running'){
    actions = `<button class="btn-ghost !py-1 text-xs" onclick="cancelJob('${j.id}', this)">Cancel</button>`;
  } else {
    // done / failed / cancelled → offer a fresh run with the same parameters.
    actions = `<button class="btn-ghost !py-1 text-xs" onclick="restartJob('${j.id}', this)">Restart</button>`;
  }
  return `
  <div class="rounded-lg border border-line bg-surface-alt p-4" data-job="${j.id}">
    <div class="flex items-center justify-between gap-3">
      <div class="min-w-0">
        <p class="font-medium text-ink truncate">${j.description}</p>
        <p class="text-xs text-slate-500">${shortId} · ${j.kind} · ${new Date(j.created_at*1000).toLocaleString()}</p>
      </div>
      <div class="flex items-center gap-3 shrink-0">
        ${statusBadge(j.status)}
        ${actions}
        <button class="btn-ghost !py-1 text-xs" onclick="toggleLog('${j.id}', this)">Log</button>
      </div>
    </div>
    <div class="mt-3 h-1.5 w-full overflow-hidden rounded-full bg-slate-200">
      <div class="h-full bg-brand transition-all" style="width:${j.progress}%"></div>
    </div>
    <pre class="log hidden mt-3" data-stream="${j.id}"></pre>
  </div>`;
}
function toggleLog(jobId, btn){
  const pre = document.querySelector(`[data-stream="${jobId}"]`);
  if(pre.classList.contains('hidden')){
    pre.classList.remove('hidden');
    btn.textContent = 'Hide log';
    startStream(jobId, pre);
  } else {
    pre.classList.add('hidden');
    btn.textContent = 'Show log';
  }
}

function startStream(jobId, el){
  if(el.dataset.started) return;
  el.dataset.started = '1';
  const es = new EventSource(`/api/stream/${jobId}`);
  es.onmessage = (ev) => {
    let msg; try { msg = JSON.parse(ev.data); } catch { return; }
    if(msg.line){ el.textContent += msg.line + '\n'; el.scrollTop = el.scrollHeight; }
    if(msg.final){ el.textContent += '\n=== DONE ===\n' + JSON.stringify(msg.final.result, null, 2); es.close(); }
  };
}

refresh();
setInterval(refresh, 3000);
</script>
{% endblock %}
