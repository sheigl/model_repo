[project]
name = "model-repo"
version = "0.1.0"
description = "AI model deployment web app: catalog a central repo and sync to target machines via rsync-over-SSH, plus HuggingFace downloads."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "jinja2>=3.1.4",
    "python-multipart>=0.0.9",
    "pyyaml>=6.0",
    "httpx>=0.27.0",
    "huggingface_hub>=1.0",
    "playwright>=1.62.0",
]

[project.scripts]
model-repo = "app.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
